plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.diffplug.spotless'
}

apply from: "$project.rootDir/spotless.gradle"

android {
    compileSdk rootProject.ext.compileSdkVersion

    packaging {
        resources {
            it.excludes += '**/design.drawio'
            it.excludes += '**/highlevel.drawio'
            it.excludes += '**/highlevel.jpg'
            it.excludes += '**/component.png'
            it.excludes += '**/model.png'

            it.excludes += "META-INF/DEPENDENCIES"
            it.excludes += "META-INF/LICENSE"
            it.excludes += "META-INF/LICENSE.txt"
            it.excludes += "META-INF/license.txt"
            it.excludes += "META-INF/NOTICE"
            it.excludes += "META-INF/NOTICE.txt"
            it.excludes += "META-INF/notice.txt"
            it.excludes += "META-INF/ASL2.0"
            it.excludes += "META-INF/*.kotlin_module"
        }
    }

    defaultConfig {
        applicationId "org.obd.graphs.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.compileSdkVersion
        versionName new Date().format('yyyyMMdd.HHmm')
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        testFunctionalTest false
        testHandleProfiling false
        resValue "string", "DEFAULT_PROFILE", "profile_21"
        archivesBaseName = "GSeriesIndicators.$versionName"
    }

    sourceSets {
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
        play.setRoot('build-types/release')
    }

    // Local builds have no release keystore: debug falls back to the SDK's default debug
    // keystore, release/play stay unsigned until ANDROID_RELEASE_KEYSTORE is set.
    def releaseKeystore = System.getenv("ANDROID_RELEASE_KEYSTORE")
    def useReleaseKeystore = { config ->
        config.storeFile = file(releaseKeystore)
        config.storePassword = System.getenv("ANDROID_RELEASE_STORE_PASSWORD")
        config.keyAlias = System.getenv("ANDROID_RELEASE_KEY_ALIAS")
        config.keyPassword = System.getenv("ANDROID_RELEASE_KEY_PASSWORD")
    }

    signingConfigs {

        debug {
            if (releaseKeystore) {
                useReleaseKeystore(it)
            } else {
                storeFile file("${System.getProperty("user.home")}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }

        release {
            if (releaseKeystore) useReleaseKeystore(it)
        }

        play {
            if (releaseKeystore) useReleaseKeystore(it)
        }
    }

    flavorDimensions = ["version" ]
    productFlavors {

        // The one flavor left: the applicationId stays upstream's, so the installed app keeps its settings.
        giuliaAA {
            dimension "version"
            resValue "string", "DEFAULT_PROFILE", "profile_21"
            resValue "string", "applicationId", "org.obd.graphs.my.giulia.aa"
            applicationId "org.obd.graphs.my.giulia.aa"
            versionCode 256
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            signingConfig signingConfigs.release

            resValue "bool", "MODULE_ANDROID_AUTO_ENABLED", "true"
            resValue "bool", "FF_READ_RESOURCE_EXTERNAL_STORAGE_ENABLED", "false"
            resValue "bool", "FF_RESULT_CACHE_ENABLED", "false"
            resValue "bool", "FF_SWITCH_NETWORK_ENABLED", "false"
            resValue "bool", "FF_SHIFT_LIGHTS_ENABLED", "false"
            resValue "bool", "DEBUG_BUILD", "false"
        }

        play {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            signingConfig signingConfigs.release

            resValue "bool", "MODULE_ANDROID_AUTO_ENABLED", "false"
            resValue "bool", "FF_READ_RESOURCE_EXTERNAL_STORAGE_ENABLED", "false"
            resValue "bool", "FF_RESULT_CACHE_ENABLED", "false"
            resValue "bool", "FF_SWITCH_NETWORK_ENABLED", "false"
            resValue "bool", "FF_SHIFT_LIGHTS_ENABLED", "false"
            resValue "bool", "DEBUG_BUILD", "false"
        }

        debug {

            resValue "bool", "MODULE_ANDROID_AUTO_ENABLED", "true"
            resValue "bool", "FF_READ_RESOURCE_EXTERNAL_STORAGE_ENABLED", "true"
            resValue "bool", "FF_RESULT_CACHE_ENABLED", "true"
            resValue "bool", "FF_SWITCH_NETWORK_ENABLED", "true"
            resValue "bool", "FF_SHIFT_LIGHTS_ENABLED", "true"
            resValue "bool", "DEBUG_BUILD", "true"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    lint {
        disable 'KtxExtensionAvailable', 'GradleDependency', 'ViewConstructor', 'IconLauncherShape'
    }
    namespace "org.obd.graphs"

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation project(':screen_renderer')
    implementation project(":datalogger")
    implementation project(":common")
    implementation project(':profile')

    debugImplementation project(":automotive")
    releaseImplementation project(":automotive")

    // This specific library provides lifecycleScope
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    // (Optional) If you are using it in a ViewModel, you might also need:
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"

    implementation("androidx.core:core-splashscreen:1.0.1")

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.core:core-ktx:1.2.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.0'

    implementation("androidx.activity:activity-ktx:1.9.3")
    implementation("androidx.fragment:fragment-ktx:1.8.5")

    implementation 'org.slf4j:slf4j-api:1.7.25'
    implementation 'com.github.tony19:logback-android:2.0.0'
    implementation 'org.apache.commons:commons-collections4:4.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.11.0'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.11.0'
    implementation 'io.reactivex:rxjava:1.3.8'
    implementation 'io.apisense:rhino-android:1.3.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'io.dropwizard.metrics:metrics-core:4.1.17'
    implementation 'com.dynatrace.dynahist:dynahist:1.1'
    implementation("io.github.tzebrowski:obd-metrics:$obdMetricVersion") { changing = true }
    implementation 'com.github.kizitonwose.colorpreference:core:1.1.0'
    implementation 'com.github.kizitonwose.colorpreference:support:1.1.0'
    debugImplementation 'com.github.DonaldDu:FixUnhandledEvent:1.0'
    implementation 'pub.devrel:easypermissions:3.0.0'

    testImplementation 'junit:junit:4.13.2'

    implementation 'com.github.mik3y:usb-serial-for-android:3.5.1'

}
