## BMW G31 LCI 520d MHEV (B47, 48 V) for the Classic dashboard (doc/specs/classic-dashboard-tech.md §4.2).
## The DIDs in bmw_b47_mhev.json are candidates from BMW's ECU descriptions (tech design §4.3), not yet seen on the car;
## in a debug build pick the "mock" connection type to see every dial move on the DHU.
pref.profile.names.profile_21=BMW G31 520d MHEV (BT,AA)
profile_21.pref.profile.id=profile_21
profile_21.pref.profile.about=BMW G31 520d MHEV (B47 diesel, 48 V mild hybrid) for the Classic Android Auto dashboard.\nDDE and EGS are reached through 6F1 with CAN extended addressing.
profile_21.pref.profile.tags=bmw,b47,bluetooth,aa

profile_21.pref.adapter.connection.type=bluetooth
profile_21.pref.adapter.id=
profile_21.pref.adapter.init.protocol=CAN_11
profile_21.pref.adapter.init.delay_after_reset="500"
profile_21.pref.adapter.init.delay="500"
profile_21.pref.adapter.init.fetchDeviceProperties=false
profile_21.pref.adapter.init.fetchSupportedPids=false
profile_21.pref.adapter.reconnect=true
profile_21.pref.adapter.reconnect.max_retry="3"
profile_21.pref.adapter.graceful_stop.enabled=false
profile_21.pref.adapter.cache.result.enabled=false
profile_21.pref.adapter.adaptive.enabled=false
# STN batches skip ATSH / ATCEA for extended entries (tech design F10).
profile_21.pref.adapter.stn.enabled=false
# Priorities only apply with batching on (tech design F9).
profile_21.pref.adapter.batch.enabled=true
profile_21.pref.adapter.batch_01.size="6"
profile_21.pref.adapter.query.individual.enabled=false
profile_21.pref.profile.2_0_GME_extension.enabled=false

profile_21.pref.pids.registry.list=[mode01.json, mode01_2.json, bmw_b47_mhev.json]
# Mode 22 PIDs are not in the 01 00 bitmap.
profile_21.pref.pids.registry.filter_pids_ecu_supported=false
profile_21.pref.pids.registry.filter_pids_stable=false

#CAN Request ID mappings. Quote numbers: an unquoted value loads as an Int.
profile_21.pref.adapter.init.mode.selected=mode_1
profile_21.pref.adapter.init.mode.id="01"
profile_21.pref.adapter.init.mode.header=7E0

# Physical 7E0 rather than functional 7DF: with 7DF the DDE and the EGS may both answer (tech design Q5).
profile_21.pref.adapter.init.mode.header_value.mode_1=7E0
profile_21.pref.adapter.init.mode.id_value.mode_1="01"
profile_21.pref.adapter.init.mode.description_value.mode_1="OBD-II"

profile_21.pref.adapter.init.mode.header_value.mode_2=6F1
profile_21.pref.adapter.init.mode.id_value.mode_2="22"
profile_21.pref.adapter.init.mode.extended_address_value.mode_2="12"
profile_21.pref.adapter.init.mode.receive_address_value.mode_2="612"
profile_21.pref.adapter.init.mode.description_value.mode_2="DDE"

profile_21.pref.adapter.init.mode.header_value.mode_3=6F1
profile_21.pref.adapter.init.mode.id_value.mode_3="EGS"
profile_21.pref.adapter.init.mode.extended_address_value.mode_3="18"
profile_21.pref.adapter.init.mode.receive_address_value.mode_3="618"
profile_21.pref.adapter.init.mode.description_value.mode_3="EGS"

# 48 V battery: diagnostic address 02 in the SP2018 gateway's table (tech design Q3, not yet seen on the car).
profile_21.pref.adapter.init.mode.header_value.mode_4=6F1
profile_21.pref.adapter.init.mode.id_value.mode_4="BAT48"
profile_21.pref.adapter.init.mode.extended_address_value.mode_4="02"
profile_21.pref.adapter.init.mode.receive_address_value.mode_4="602"
profile_21.pref.adapter.init.mode.description_value.mode_4="48 V battery"

## Android Auto
# Smooth pointer easing needs more than the app's default 5 fps (tech design Q6).
profile_21.pref.aa.surface.fps="15"
profile_21.pref.graph.filter.source="AA"
